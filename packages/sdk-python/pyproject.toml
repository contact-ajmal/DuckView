[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckview"
version = "0.1.0"
description = "Python SDK for DuckView: query workspaces, browse the catalog, build Streamlit data apps on analytics data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
arrow = ["pyarrow>=12"]
streamlit = ["streamlit>=1.30", "pandas>=1.5", "pyarrow>=12"]
all = ["pandas>=1.5", "pyarrow>=12", "streamlit>=1.30", "polars>=0.20"]

[tool.setuptools.packages.find]
include = ["duckview*"]
