name: Docker Hub description

# Keeps the Docker Hub overview page in sync with docs/DOCKERHUB.md without rebuilding the image.
# Needs DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (Read, Write & Delete scope) — the same secrets as the publish workflow.

on:
  push:
    branches: ["main"]
    paths: ["docs/DOCKERHUB.md", ".github/workflows/dockerhub-description.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || format('{0}/duckview', secrets.DOCKERHUB_USERNAME) }}
          short-description: DuckDB workspace: lakehouse, dashboards, MCP for AI agents. Docs at contact-ajmal.github.io/DuckView
          readme-filepath: ./docs/DOCKERHUB.md
          enable-url-completion: true
