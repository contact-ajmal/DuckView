name: Publish Docker image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  # GitHub Container Registry by default (no secrets needed); set the IMAGE repository variable to publish elsewhere.
  IMAGE: ${{ vars.IMAGE || 'ghcr.io/contact-ajmal/duckview' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DUCKVIEW_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke test the pushed image (native arch)
        run: |
          docker run -d --name dv -p 4200:4200 \
            -e JWT_SECRET=ci-jwt-secret-0123456789abcdef \
            -e ENCRYPTION_KEY=$(openssl rand -hex 32) \
            -e DUCKVIEW_ADMIN_EMAIL=ci@example.com -e DUCKVIEW_ADMIN_PASSWORD=ci-password-123 \
            ${{ env.IMAGE }}:${{ github.ref_name }}
          node scripts/smoke.mjs http://localhost:4200 ci@example.com ci-password-123
          docker logs dv | tail -20
          docker rm -f dv
