# Copy to secret.yaml, fill in values, and NEVER commit the result.
# Generate keys:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: duckview-secrets
  namespace: duckview
type: Opaque
stringData:
  JWT_SECRET: "replace-with-openssl-rand-hex-32"
  ENCRYPTION_KEY: "replace-with-64-hex-chars"
  DATABASE_URL: "postgres://duckview:password@postgres.duckview.svc:5432/duckview"
  DUCKVIEW_ADMIN_EMAIL: "admin@example.com"
  DUCKVIEW_ADMIN_PASSWORD: "replace-me"
  # OIDC_ISSUER: "https://login.example.com/realms/main"
  # OIDC_CLIENT_ID: ""
  # OIDC_CLIENT_SECRET: ""
