apiVersion: v1
kind: Service
metadata:
  name: duckview
  namespace: duckview
  labels: { app.kubernetes.io/name: duckview }
spec:
  selector: { app.kubernetes.io/name: duckview }
  ports:
    - { name: http, port: 80, targetPort: http }
    # Data apps on their own origin (apps.isolation): the Ingress routes apps.<domain> here.
    - { name: apps, port: 8080, targetPort: apps }
  # Sticky sessions keep an agent's /mcp/sse stream and /mcp/messages POSTs on the same pod when scaled out.
  sessionAffinity: ClientIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duckview
  namespace: duckview
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # long-lived SSE / WebSocket
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["duckview.example.com", "apps.duckview.example.com"]
      secretName: duckview-tls
  rules:
    - host: duckview.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: duckview, port: { name: http } }
    # Data apps get their own host (same registrable domain as the UI, so the app cookie reaches iframes); set
    # DUCKVIEW_APPS_PUBLIC_URL to it.
    - host: apps.duckview.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: duckview, port: { name: apps } }
